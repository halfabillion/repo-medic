# Repo Medic rules for JavaScript/TypeScript. Written for the Builder.io Agent-Native hackathon (Nov 2026).
# Rules with a `fix:` are safe one-line rewrites that Repo Medic can apply deterministically.
# Everything else is routed to the agent, which drafts a patch the user reviews.
rules:
  - id: rm.js.sql-built-from-input
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      SQL text is built by interpolating a value. If that value comes from a request, an attacker can change the query
      (SQL injection). Use a placeholder (`?`) and pass the value as a bound parameter.
    metadata: { cwe: "CWE-89", category: injection, confidence: high, title: "SQL query built from input" }
    pattern-either:
      - pattern: $DB.prepare(`...${$X}...`)
      - pattern: $DB.query(`...${$X}...`)
      - pattern: $DB.exec(`...${$X}...`)
      - pattern: $DB.prepare("..." + $X + "...")
      - pattern: $DB.query("..." + $X + "...")
      - pattern: $DB.exec("..." + $X + "...")

  - id: rm.js.html-built-from-input
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      HTML is assembled from a variable and written straight to the response. If the value comes from the request this
      is reflected cross-site scripting (XSS). HTML-escape the value or use a template engine that escapes by default.
    metadata: { cwe: "CWE-79", category: xss, confidence: medium, title: "HTML response built from input" }
    patterns:
      - pattern-either:
          - pattern: $RES.end($A + $X + $B)
          - pattern: $RES.send($A + $X + $B)
          - pattern: $RES.write($A + $X + $B)
          - pattern: $RES.end(`...${$X}...`)
          - pattern: $RES.send(`...${$X}...`)
      - metavariable-regex: { metavariable: $A, regex: "(?s).*<.*" }

  - id: rm.js.shell-command-from-input
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A shell command string is built from a variable and run with child_process.exec, which invokes /bin/sh. A value
      like `x; rm -rf ~` runs extra commands (OS command injection). Use execFile/spawn with an argument array and
      validate the input.
    metadata: { cwe: "CWE-78", category: injection, confidence: high, title: "Shell command built from input" }
    pattern-either:
      - pattern: exec("..." + $X, ...)
      - pattern: exec(`...${$X}...`, ...)
      - pattern: $CP.exec("..." + $X, ...)
      - pattern: $CP.exec(`...${$X}...`, ...)
      - pattern: execSync("..." + $X, ...)
      - pattern: execSync(`...${$X}...`, ...)

  - id: rm.js.eval-json-literal
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      `eval` is used to parse data. Any JavaScript in the input runs with the server's privileges (code injection).
      The input is a JSON-style literal, so JSON.parse is a drop-in replacement.
    metadata: { cwe: "CWE-95", category: injection, confidence: high, title: "eval() used to parse data", fix_summary: "Parse the value with JSON.parse instead of eval, so the input can no longer run code." }
    pattern: eval("(" + $RAW + ")")
    fix: JSON.parse($RAW)

  - id: rm.js.eval
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      `eval` runs a string as code. If any part of it can come from a user this is code injection. Replace it with a
      parser or a lookup table.
    metadata: { cwe: "CWE-95", category: injection, confidence: medium, title: "eval() of a dynamic string" }
    patterns:
      - pattern: eval($X)
      - pattern-not: eval("...")
      - pattern-not: eval("(" + $RAW + ")")

  - id: rm.js.weak-password-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      MD5/SHA-1 are broken for security use and are fast to brute-force. Switch to SHA-256 at minimum; for passwords
      prefer scrypt/argon2 with a per-user salt.
    metadata: { cwe: "CWE-328", category: crypto, confidence: high, title: "Weak hash algorithm (MD5/SHA-1)", fix_summary: "Swap MD5/SHA-1 for SHA-256. A stopgap: password storage should move to scrypt or argon2 with a salt (needs a data migration)." }
    pattern-either:
      - pattern: $C.createHash("md5")
      - pattern: $C.createHash("sha1")
    fix: $C.createHash("sha256")

  - id: rm.js.insecure-random-token
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Math.random() is predictable and must not be used for session tokens, reset links or other secrets. Use
      crypto.randomBytes (or crypto.randomUUID).
    metadata: { cwe: "CWE-338", category: crypto, confidence: high, title: "Predictable random value used as a token", fix_summary: "Generate the token with crypto.randomBytes (a CSPRNG) instead of Math.random." }
    patterns:
      - pattern: Math.random().toString(36).slice(2)
      - pattern-inside: |
          function $F(...) { ... }
      - metavariable-regex: { metavariable: $F, regex: "(?i).*(token|secret|session|nonce|password|key|salt).*" }
    fix: crypto.randomBytes(16).toString("hex")

  - id: rm.js.cookie-not-httponly
    languages: [javascript, typescript]
    severity: WARNING
    message: Session cookie is readable from JavaScript, so any XSS can steal it. Set httpOnly to true.
    metadata: { cwe: "CWE-1004", category: config, confidence: high, title: "Cookie missing HttpOnly" }
    pattern: "{..., httpOnly: false, ...}"
